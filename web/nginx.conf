server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same as the Vite dev proxy: /api/foo -> http://techrag:8000/foo (the API sends no CORS headers).
    location /api/ {
        proxy_pass http://techrag:8000/;
        # /ask waits on a local language model, which can take a while.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
