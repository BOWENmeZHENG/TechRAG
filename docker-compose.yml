services:
  techrag:
    build: .
    ports:
      - "8000:8000"
    command: ["--ollama-url", "http://ollama:11434"]
    depends_on:
      - ollama

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - techrag

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
