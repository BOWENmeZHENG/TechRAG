[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[project]
name = "techrag"
version = "0.1.0"
description = "Retrieval-augmented generation over technical documentation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bowen Zheng", email = "bowenzheng01@gmail.com" }]
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
techrag-ingest = "techrag.ingest:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
