[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[project]
name = "techrag"
version = "0.1.0"
description = "Retrieval-augmented generation over technical documentation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bowen Zheng", email = "bowenzheng01@gmail.com" }]
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.148.0",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14",
    "uvicorn>=0.54.0",
]

[project.scripts]
techrag-ingest = "techrag.ingest:main"
techrag-retrieve = "techrag.retrieve:main"
techrag-eval = "techrag.evaluate:main"
techrag-ask = "techrag.generate:main"
techrag-serve = "techrag.api:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

# Linux gets the CPU-only torch build (no CUDA libraries), which keeps the Docker image and CI
# installs small. Other platforms use the default PyPI wheels, which are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
