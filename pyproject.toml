[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[project]
name = "techrag"
version = "0.1.0"
description = "Retrieval-augmented generation over documentation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bowen Zheng", email = "bowenzheng01@gmail.com" }]
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.148.0",
    "langchain-text-splitters>=1.1.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.13",
    "sentence-transformers>=6.1.0",
    "torch>=2.14",
    "uvicorn>=0.54.0",
]

[project.scripts]
techrag-ingest = "techrag.core.ingest:main"
techrag-retrieve = "techrag.core.retrieve:main"
techrag-ask = "techrag.core.generate:main"
techrag-serve = "techrag.api:main"
techrag-subset = "techrag.benchmarks.bench:main"
techrag-recall = "techrag.eval.recall:main"
techrag-judge = "techrag.eval.judge:main"
techrag-baseline = "techrag.reasoning.baseline:main"
techrag-agent = "techrag.reasoning.agent:main"
techrag-compare = "techrag.reasoning.compare:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

# Linux gets the CPU-only torch build (no CUDA libraries), which keeps the Docker image and CI
# installs small. Other platforms use the default PyPI wheels, which are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade, pydocstyle
ignore = ["D100", "D104", "D105", "D107"]  # don't require module/package/magic/__init__ docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
