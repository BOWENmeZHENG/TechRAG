# Settings that determine what the index contains. dvc.yaml's ingest stage reads these, so
# changing one makes `dvc repro` rebuild the index and records the new values in dvc.lock.
ingest:
  size: 500 # max characters per chunk
  overlap: 50 # characters shared by adjacent chunks
  model: BAAI/bge-small-en-v1.5 # sentence-transformers model; queries must use the same one
